# This machine has 15 GB of RAM. Flutter's migrator writes -Xmx8G here by
# default, and with a 4 GB metaspace on top the Gradle daemon alone can claim
# more than the machine has once an emulator and the Dart toolchain are also
# running — it took the whole desktop down once. These bounds are deliberate;
# raise them only on a bigger machine.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
